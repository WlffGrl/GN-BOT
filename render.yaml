services:
  - type: worker
    name: discord-gn-bot
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node index.js
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CHANNEL_IDS
        sync: false
      - key: TZ
        value: Asia/Bangkok
